<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Surface AR - Camera Fix</title><style>html,body{margin:0;background:#08090d;color:white;font-family:-apple-system,system-ui,sans-serif;height:100%;overflow:hidden}#preview{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}#overlay{position:fixed;inset:0;display:none;pointer-events:none}#overlay img{position:absolute;left:50%;top:50%;width:58vw;max-width:450px;transform:translate(-50%,-50%);opacity:.72;mix-blend-mode:screen}#panel{position:fixed;z-index:20;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));background:#121420e8;border:1px solid #ffffff33;border-radius:15px;padding:13px;max-width:500px}h1{font-size:18px;margin:0 0 7px}p{font-size:12px;color:#d2d2df;line-height:1.45;margin:5px 0}button{padding:10px;border-radius:10px;border:1px solid #aaa;color:white;background:#393057;font-size:14px;margin:5px 4px 4px 0}#status{font-size:12px;color:#ffe59e;white-space:pre-wrap;margin-top:6px}input[type=range]{width:110px}label{font-size:12px;margin-right:8px}#capture{display:none}#arhost{position:fixed;inset:0;z-index:2;display:none}#arhost video{object-fit:cover!important}#footer{position:fixed;z-index:5;bottom:12px;left:10px;right:10px;text-align:center;font-size:11px;color:#ddd;text-shadow:0 1px 5px black}</style></head><body><video id="preview" autoplay playsinline muted></video><div id="arhost"></div><div id="overlay"><img id="sticker" src="graphic.png"></div><div id="panel"><h1>Surface AR / Camera Fix</h1><p>1. Test your camera first. 2. If the camera works, try HIRO AR. If AR is unavailable, use Sticker Mode for a visual site test.</p><button id="start">1. Test Camera</button><button id="ar">2. Start HIRO AR</button><button id="fallback">Sticker Mode</button><button id="capture">Save Photo</button><div><label>Size <input type="range" id="size" min="20" max="100" value="58"></label><label>Opacity <input type="range" id="alpha" min="15" max="100" value="72"></label></div><div id="status">Press 'Test Camera' to begin.</div></div><div id="footer">HIRO marker-based AR · HTTPS required · Markerless surface tracking is not supported</div><script>
const video=document.querySelector('#preview'),status=document.querySelector('#status'),overlay=document.querySelector('#overlay'),sticker=document.querySelector('#sticker'),arhost=document.querySelector('#arhost');let stream=null,mode='none';
function report(s){status.textContent=s}function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){report('This browser does not support camera access. Check Safari and HTTPS.');return false}try{stop();stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});video.srcObject=stream;await video.play();video.style.display='block';report('Camera working ('+video.videoWidth+'×'+video.videoHeight+'). Now try Start HIRO AR.');return true}catch(e){report('Camera error: '+e.name+' — '+e.message+'\nCheck Safari camera permissions or whether another app is using the camera.');return false}}
document.querySelector('#start').onclick=async()=>{overlay.style.display='none';arhost.style.display='none';await startCamera()};document.querySelector('#fallback').onclick=async()=>{if(!stream && !await startCamera())return;arhost.style.display='none';overlay.style.display='block';mode='sticker';document.querySelector('#capture').style.display='inline-block';report('Sticker Mode: AR 추적이 아닌 화면 합성이야. 위치는 화면 중앙에 고정돼.')};document.querySelector('#size').oninput=e=>sticker.style.width=e.target.value+'vw';document.querySelector('#alpha').oninput=e=>sticker.style.opacity=e.target.value/100;
document.querySelector('#capture').onclick=()=>{if(mode!=='sticker')return;let c=document.createElement('canvas');c.width=video.videoWidth||720;c.height=video.videoHeight||1280;let ctx=c.getContext('2d');ctx.drawImage(video,0,0,c.width,c.height);let r=sticker.getBoundingClientRect(),v=video.getBoundingClientRect(),scale=c.width/v.width;let w=r.width*scale,h=r.height*scale,x=(r.left-v.left)*scale,y=(r.top-v.top)*scale;ctx.globalAlpha=parseFloat(sticker.style.opacity||'.72');ctx.globalCompositeOperation='screen';ctx.drawImage(sticker,x,y,w,h);let a=document.createElement('a');a.download='surface-ar-test.png';a.href=c.toDataURL('image/png');a.click();report('Save Photo을 요청했어. iPhone에서 파일/다운로드를 확인해줘.')};
function loadScript(url){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=()=>reject(new Error('Failed to load library: '+url));document.head.appendChild(s)})}
document.querySelector('#ar').onclick=async()=>{report('Loading AR libraries...');try{if(!window.AFRAME)await loadScript('https://aframe.io/releases/1.5.0/aframe.min.js');if(!window.THREEx)await loadScript('https://cdn.jsdelivr.net/npm/ar.js@3.4.7/aframe/build/aframe-ar.js');stop();overlay.style.display='none';video.style.display='none';arhost.style.display='block';arhost.innerHTML='<a-scene embedded vr-mode-ui="enabled:false" renderer="alpha:true;antialias:true" arjs="sourceType:webcam;trackingMethod:best;debugUIEnabled:false" device-orientation-permission-ui="enabled:false"><a-assets><img id="argraphic" src="graphic.png"></a-assets><a-marker preset="hiro" id="hiro"><a-plane src="#argraphic" position="0 0.02 0" rotation="-90 0 0" width="1.4" height="1.08" material="shader:flat;transparent:true;opacity:0.8;side:double"></a-plane></a-marker><a-entity camera></a-entity></a-scene>';document.querySelector('#hiro').addEventListener('markerFound',()=>report('HIRO marker detected!'));document.querySelector('#hiro').addEventListener('markerLost',()=>report('Marker lost. Point your camera at the HIRO marker.'));report('AR startup requested. Point your camera at a HIRO marker. A black screen may indicate an AR library compatibility issue.');setTimeout(()=>{let arVideo=document.querySelector('#arhost video');if(!arVideo||arVideo.readyState<2)report('AR 카메라 영상이 시작되지 않았어. 카메라 테스트가 정상이라면 Safari와 AR.js의 호환/초기화 문제야. Sticker Mode는 사용할 수 있어.')},6500)}catch(e){report('AR failed to start: '+e.message+'\n카메라 테스트 또는 Sticker Mode를 사용해줘.');arhost.style.display='none';video.style.display='block';await startCamera()}};
</script></body></html>
